<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tadbir</title>
<meta name="description" content="Tadbir: private, encrypted organiser for bills, money, diary and daily practice.">
<meta name="theme-color" content="#0e4a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pocket ledger. One column, summary first, rows you can tick, a tab bar under the thumb. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --ink:#14231f; --muted:#5a6a64; --line:#d6dedb;
  --accent:#0f6b54; --accent-ink:#ffffff; --accent-soft:#dcefe8;
  --good:#1d7f49; --warn:#a8690c; --crit:#c0332a;
  --good-soft:#dff2e6; --warn-soft:#fbeed3; --crit-soft:#fbe1de;
  --s-business:#2f5fd0; --s-personal:#b4487a; --s-volunteering:#c2740f; --s-development:#6a4bc4; --s-faith:#0f8a6a;
  --hero:#0e4a3c; --hero-ink:#f1fbf6; --gold:#f2c14e; --shadow:0 1px 2px rgba(20,35,31,.05),0 8px 24px rgba(20,35,31,.07);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513; --surface:#17201d; --ink:#e7efeb; --muted:#94a59e; --line:#2a3632;
    --accent:#4cc3a0; --accent-ink:#06241b; --accent-soft:#16382f;
    --good:#5fd08c; --warn:#e7b04f; --crit:#f0796f;
    --good-soft:#143524; --warn-soft:#3a2d10; --crit-soft:#3f1a17;
    --hero:#143f34; --hero-ink:#eafaf3; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.3);
    --s-business:#7da0ff; --s-personal:#e88ab5; --s-volunteering:#eda94a; --s-development:#a892f0; --s-faith:#4cc3a0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#17201d; --ink:#e7efeb; --muted:#94a59e; --line:#2a3632;
  --accent:#4cc3a0; --accent-ink:#06241b; --accent-soft:#16382f;
  --good:#5fd08c; --warn:#e7b04f; --crit:#f0796f;
  --good-soft:#143524; --warn-soft:#3a2d10; --crit-soft:#3f1a17;
    --hero:#143f34; --hero-ink:#eafaf3; --gold:#f2c14e; --shadow:0 1px 2px rgba(0,0,0,.3);
  --s-business:#7da0ff; --s-personal:#e88ab5; --s-volunteering:#eda94a; --s-development:#a892f0; --s-faith:#4cc3a0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 104px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0}
.brand span{color:var(--accent)}
.brand .ar{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;font-weight:600;font-size:26px;letter-spacing:0;margin-left:8px;color:var(--muted)}
.date{color:var(--muted);font-size:14px}
.notice{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;font-size:14px}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;overflow-wrap:anywhere}
.tile .n{font-size:13px;color:var(--muted)}
.tile.crit{border-color:var(--crit)} .tile.crit .v{color:var(--crit)}
.tile.wide{grid-column:1/-1}
.split{display:flex;gap:16px;flex-wrap:wrap}
.split div{display:flex;flex-direction:column}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid var(--line);border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.crit{border-left-color:var(--crit)} .row.warn{border-left-color:var(--warn)} .row.good{border-left-color:var(--good)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;background:none;border:0;padding:0;text-align:left}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--good)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)}
.empty{padding:16px;color:var(--muted);font-size:14px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px;white-space:nowrap}
.btn.danger{background:transparent;color:var(--crit);border:1.5px solid var(--crit)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.d-Business{background:var(--s-business)} .d-Personal{background:var(--s-personal)} .d-Volunteering{background:var(--s-volunteering)} .d-Development{background:var(--s-development)} .d-Faith{background:var(--s-faith)} .d-bill{background:var(--crit);border-radius:2px}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:transparent;flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.check svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.check[aria-pressed="true"] svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--muted)}
.week{display:flex;gap:6px;align-items:flex-end}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.week i{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:linear-gradient(to top,var(--s-faith) var(--f,0%),transparent var(--f,0%))}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav b{min-width:120px;text-align:center;font-family:var(--display)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px;padding:12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}
.bar .track{grid-column:1/-1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:99px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal button{background:transparent;border:1.5px solid transparent;border-radius:8px;min-height:46px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.cal button.today .num{color:var(--accent);font-weight:700}
.cal button.sel{border-color:var(--accent);background:var(--accent-soft)}
.cal .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:36px}
.cal .dots .dot{width:6px;height:6px}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs div{display:flex;width:100%;max-width:720px}
nav.tabs a{flex:1;text-align:center;padding:10px 4px 12px;text-decoration:none;color:var(--muted);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:3px solid transparent}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent);border-top-color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.field input,.field select,.field textarea{font-weight:400;font-size:16px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);width:100%;min-height:44px}
.field textarea{min-height:72px;resize:vertical}
.field.inline{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.field.inline input{width:22px;min-height:22px;height:22px;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:84px;margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;text-align:center;display:none;z-index:20}
.toast.show{display:block}

body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 220px) no-repeat var(--bg)}
.wrap{padding-bottom:128px}
.list,.tile,.cal{border-radius:16px;box-shadow:var(--shadow)}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.hero .k{font-size:14px;opacity:.8}
.hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.hero .cap{font-size:13px;opacity:.8}
.hero .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .meter i{display:block;height:100%;background:var(--gold);border-radius:99px}
.hero .split{gap:24px}
.hero .split b{font-family:var(--display);font-size:20px}
.hero .split span{font-size:13px;opacity:.8}
.row.e-Business{border-left-color:var(--s-business)}.row.e-Personal{border-left-color:var(--s-personal)}.row.e-Volunteering{border-left-color:var(--s-volunteering)}.row.e-Development{border-left-color:var(--s-development)}.row.e-Faith{border-left-color:var(--s-faith)}
.ring{width:40px;height:40px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--s-faith);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.btn{border-radius:12px}
.chip{min-height:38px}
nav.tabs{left:12px;right:12px;bottom:12px;background:none;border:0;padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs div{max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px;gap:4px;box-shadow:0 10px 30px rgba(10,25,20,.18)}
nav.tabs a{border-top:0;border-radius:16px;padding:8px 4px}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
.toast{bottom:104px}
.ltrack{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.ltrack i{display:block;height:100%;background:var(--accent);border-radius:99px}
nav.tabs a{font-size:12px}
.hright{display:flex;align-items:center;gap:10px}
.ar-s{font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",serif;font-weight:600;color:var(--muted);margin-left:6px}
.lead{color:var(--muted);margin:0;font-size:15px}
.row.foot{flex-wrap:wrap}.row.foot .main{flex:1 1 150px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;word-break:break-all;font-size:15px}
.linkbtn{background:none;border:0;color:var(--accent);padding:10px 0;text-align:left;font-weight:600;min-height:44px}
.auth{display:flex;flex-direction:column;gap:12px}
.auth .btn[disabled]{opacity:.6}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){
  .sheet-bg.open .sheet{animation:up .22s ease-out}
  #view.enter{animation:fade .25s ease-out}
  .check{transition:background .15s,border-color .15s,transform .15s}.check:active{transform:scale(.88)}
  .btn:active,.chip:active{transform:scale(.97)}
}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}.sheet-bg{align-items:center}.sheet{border-radius:16px}}
@media (prefers-reduced-motion:no-preference){.bar .fill{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Tad<span>bir</span> <span class="ar" lang="ar" dir="rtl">تدبير</span></h1>
    <div class="hright"><div class="date" id="dateline"></div><button class="iconbtn" id="gear" aria-label="Choose which sections to use"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div>
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Today</a>
  <a href="#bills" data-v="bills"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills</a>
  <a href="#money" data-v="money"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>Money</a>
  <a href="#diary" data-v="diary"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Diary</a>
  <a href="#loans" data-v="loans"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Loans</a>
</div></nav>

<div class="sheet-bg" id="sheetbg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
  <h2 id="sheettitle"></h2>
  <form id="sheetform" novalidate></form>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/crypto.js"></script>
<script src="js/app.js"></script>
</body>
</html>
